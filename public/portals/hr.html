<div class="portal active">
  <div class="portal-header">
    <h2>HR - Staff Management</h2>
  </div>

  <div class="grid">
    <div class="card">
      <h3>Add New Employee</h3>
      <div class="form-group">
        <label for="hr-empName">Employee Name:</label>
        <input type="text" id="hr-empName">
      </div>
      <div class="form-group">
        <label for="hr-empDept">Department:</label>
        <select id="hr-empDept">
          <option value="Medical">Medical / Doctors</option>
          <option value="Nurses">Nurses</option>
          <option value="Pharmacy">Pharmacy</option>
          <option value="Laboratory">Laboratory</option>
          <option value="Admin">Admin</option>
          <option value="Support">Support / Cleaning</option>
          <option value="Maintenance">Maintenance</option>
          <option value="Security">Security</option>
        </select>
      </div>
      <div class="form-group">
        <label for="hr-empRole">Role:</label>
        <input type="text" id="hr-empRole" placeholder="e.g. Nurse, Doctor, Cleaner">
      </div>
      <div class="form-group">
        <label for="hr-empWard">Assigned Ward:</label>
        <select id="hr-empWard"></select>
      </div>
      <div class="form-group">
        <label for="hr-empHireDate">Hire Date:</label>
        <input type="date" id="hr-empHireDate">
      </div>
      <button onclick="addEmployee()" class="primary-btn block">Hire Employee</button>
      <div id="hr-empAddMessage"></div>
    </div>

    <div class="card">
      <h3>Export Staff Data</h3>
      <p class="muted">Download employee records as CSV. Respects current filters.</p>
      <button onclick="exportStaffCSV()" class="pill-btn block">Export Staff CSV</button>
      <div id="hr-exportMessage"></div>
    </div>

    <div class="card">
      <h3>Staffing Summary</h3>
      <p>On Duty: <strong id="hr-empOnDuty">-</strong></p>
      <p>On Leave: <strong id="hr-empOnLeave">-</strong></p>
      <p>Sick: <strong id="hr-empSick">-</strong></p>
      <p>Terminated: <strong id="hr-empTerminated">-</strong></p>
      <p>Total Active: <strong id="hr-empTotal">-</strong></p>
      <button onclick="loadStaffingSummary()" class="ghost-btn block">Refresh</button>
    </div>

    <div class="card">
      <h3>Submit Tender Request</h3>
      <div class="form-group">
        <label for="hr-reqItemName">Item Name:</label>
        <input type="text" id="hr-reqItemName">
      </div>
      <div class="form-group">
        <label for="hr-reqQuantity">Quantity:</label>
        <input type="number" id="hr-reqQuantity" min="1">
      </div>
      <div class="form-group">
        <label for="hr-reqReason">Reason:</label>
        <textarea id="hr-reqReason"></textarea>
      </div>
      <button onclick="submitTenderRequest('hr')" class="primary-btn block">Submit Request</button>
      <div id="hr-requestMessage"></div>
    </div>

    <div class="card" style="grid-column: span 2;">
      <div class="card-head">
        <h3>Staff Roster</h3>
        <div class="card-head-actions">
          <button class="pill-btn" onclick="toggleAdvancedStaffFilters()">Filters</button>
        </div>
      </div>
      <div class="form-group">
        <input type="text" id="hr-empSearchBox" placeholder="Search by name, department, or role..." oninput="debouncedStaffSearch()">
      </div>
      <div id="hr-advancedFilters" class="advanced-filters" style="display:none;">
        <div class="form-row">
          <div class="form-group">
            <label>Department</label>
            <select id="hr-filterDept">
              <option value="all">All</option>
              <option value="Medical">Medical</option>
              <option value="Nurses">Nurses</option>
              <option value="Pharmacy">Pharmacy</option>
              <option value="Laboratory">Laboratory</option>
              <option value="Admin">Admin</option>
              <option value="Support">Support</option>
              <option value="Maintenance">Maintenance</option>
              <option value="Security">Security</option>
            </select>
          </div>
          <div class="form-group">
            <label>Status</label>
            <select id="hr-filterStatus">
              <option value="all">All</option>
              <option value="active">Active (On Duty)</option>
              <option value="on_leave">On Leave</option>
              <option value="sick">Sick</option>
              <option value="terminated">Terminated</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Hired From</label>
            <input type="date" id="hr-filterFrom">
          </div>
          <div class="form-group">
            <label>Hired To</label>
            <input type="date" id="hr-filterTo">
          </div>
        </div>
        <div class="form-group">
          <label>Role</label>
          <input type="text" id="hr-filterRole" placeholder="e.g. Nurse">
        </div>
        <button onclick="runStaffSearch()" class="primary-btn block">Search</button>
        <button onclick="clearStaffFilters()" class="ghost-btn block" style="margin-top:8px;">Clear Filters</button>
      </div>
      <div id="hr-empRosterTable" class="table-wrap" style="margin-top:12px;"></div>
    </div>

    <div class="card" style="grid-column: span 2;">
      <div class="card-head">
        <h3>My Tender Tracker <span class="lock-badge">LOCKED TO YOUR DEPARTMENT</span></h3>
        <div class="card-head-actions">
          <input type="text" class="search-input" id="hr-tenderSearch" placeholder="Search tenders..." oninput="filterTenders('hr')">
          <button class="pill-btn" onclick="exportMyTenders()">Export CSV</button>
        </div>
      </div>
      <div class="tender-filters" id="hr-tenderFilters">
        <button class="filter-btn active" data-filter="all" onclick="setTenderFilter(this,'hr')">All</button>
        <button class="filter-btn" data-filter="pending" onclick="setTenderFilter(this,'hr')">Pending</button>
        <button class="filter-btn" data-filter="approved" onclick="setTenderFilter(this,'hr')">Approved</button>
        <button class="filter-btn" data-filter="rejected" onclick="setTenderFilter(this,'hr')">Rejected</button>
        <button class="filter-btn" data-filter="ordered" onclick="setTenderFilter(this,'hr')">Ordered</button>
        <button class="filter-btn" data-filter="received" onclick="setTenderFilter(this,'hr')">Received</button>
      </div>
      <div id="hr-tenderTrackerList" class="tender-tracker"></div>
    </div>
  </div>
</div>
