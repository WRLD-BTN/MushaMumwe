<div class="portal active" data-dept="Radiography">
  <h2>Radiography Department</h2>
  <p class="muted">Manage scan requests, X-rays, CTs, MRIs, Ultrasounds, and ECGs.</p>

  <!-- SUMMARY STRIP -->
  <div class="disc-summary" style="margin-bottom: 20px;">
    <div class="disc-summary-item" style="border-bottom: 3px solid var(--warning);">
      <div class="disc-summary-num" id="rad-pendingCount" style="color: var(--warning);">0</div>
      <div class="disc-summary-lbl">Pending Scans</div>
    </div>
    <div class="disc-summary-item" style="border-bottom: 3px solid var(--primary);">
      <div class="disc-summary-num" id="rad-inProgressCount" style="color: var(--primary);">0</div>
      <div class="disc-summary-lbl">In Progress</div>
    </div>
    <div class="disc-summary-item" style="border-bottom: 3px solid var(--success);">
      <div class="disc-summary-num" id="rad-completedCount" style="color: var(--success);">0</div>
      <div class="disc-summary-lbl">Completed</div>
    </div>
  </div>

  <div class="grid" style="grid-template-columns: 1fr 2fr; gap: 20px; margin-bottom: 20px; align-items: start;">
    
    <!-- REQUEST SCAN -->
    <div class="card" style="margin: 0; background: var(--surface-alt);">
      <div class="card-head">
        <h3>Request Scan</h3>
      </div>
      <p class="muted" style="margin-bottom: 16px;">Search for an admitted patient and order a scan.</p>

      <div class="form-group" style="position: relative;">
        <label>Patient: <span class="req">*</span></label>
        <input type="text" id="rad-patientSearch" placeholder="Type patient name..." oninput="searchPatients()" onfocus="showPatientResults()" autocomplete="off">
        <div id="rad-patientResults" style="display: none; position: absolute; z-index: 100; top: 100%; left: 0; right: 0; background: var(--surface); border: 1.5px solid var(--border); border-top: none; border-radius: 0 0 var(--radius-sm) var(--radius-sm); max-height: 200px; overflow-y: auto; box-shadow: var(--shadow);"></div>
        <div id="rad-selectedPatient" style="display: none; margin-top: 8px; padding: 8px 12px; background: var(--success-bg); border: 1.5px solid #bbf7d0; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; color: var(--success);"></div>
      </div>

      <div class="form-group">
        <label>Scan Type: <span class="req">*</span></label>
        <select id="rad-scanType">
          <option value="X-Ray">X-Ray</option>
          <option value="CT Scan">CT Scan</option>
          <option value="MRI">MRI</option>
          <option value="Ultrasound">Ultrasound</option>
          <option value="ECG">ECG</option>
        </select>
      </div>
      <div class="form-group">
        <label>Clinical Notes:</label>
        <textarea id="rad-notes" rows="2" placeholder="e.g. Rule out fracture"></textarea>
      </div>
      <button class="primary-btn block" onclick="submitScanRequest()">Submit Request</button>
      <div id="rad-requestMessage" style="margin-top: 10px; font-weight: 600; font-size: 13px;"></div>
    </div>

    <!-- SCAN QUEUE -->
    <div class="card" style="margin: 0;">
      <div class="card-head">
        <h3>Scan Queue</h3>
        <div class="card-head-actions">
          <input type="text" class="search-input" id="rad-scanSearch" placeholder="Search patient..." oninput="renderScans()">
          <button class="pill-btn" onclick="printScanQueue()">Print</button>
        </div>
      </div>

      <!-- DATE FILTERS -->
      <div class="tender-filters" style="margin-bottom: 12px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center;">
        <button class="filter-btn active" id="rad-date-today" onclick="setRadDate('today')">Today</button>
        <button class="filter-btn" id="rad-date-week" onclick="setRadDate('week')">This Week</button>
        <button class="filter-btn" id="rad-date-month" onclick="setRadDate('month')">This Month</button>
        <button class="filter-btn" id="rad-date-all" onclick="setRadDate('all')">All Time</button>
        
        <div style="margin-left: auto; display: flex; align-items: center; gap: 6px;">
          <input type="date" id="rad-from" onchange="setRadDate('custom')" style="min-height: 30px; padding: 4px 8px; font-size: 12px; width: 115px;">
          <span class="muted">to</span>
          <input type="date" id="rad-to" onchange="setRadDate('custom')" style="min-height: 30px; padding: 4px 8px; font-size: 12px; width: 115px;">
        </div>
      </div>

      <div class="tender-filters" id="rad-scanFilters" style="margin-bottom: 12px;">
        <button class="filter-btn active" data-filter="all" onclick="setRadFilter(this)">All Statuses</button>
        <button class="filter-btn" data-filter="pending" onclick="setRadFilter(this)">Pending</button>
        <button class="filter-btn" data-filter="in_progress" onclick="setRadFilter(this)">In Progress</button>
        <button class="filter-btn" data-filter="completed" onclick="setRadFilter(this)">Completed</button>
      </div>

      <!-- 5 ROW SCROLLABLE TABLE -->
      <div id="rad-scanList" class="table-wrap roster-scroll" style="max-height: 350px; overflow-y: auto;"></div>
    </div>
  </div>
</div>
