<div class="portal active" data-dept="Procurement">
  <h2>Procurement</h2>
  <p class="muted">Manage tender requests and supplier orders.</p>

  <div class="disc-summary" id="procSummary" style="margin-bottom:20px;">
    <div class="disc-summary-item">
      <div class="disc-summary-num" id="proc-procPending">0</div>
      <div class="disc-summary-lbl">Pending</div>
    </div>
    <div class="disc-summary-item">
      <div class="disc-summary-num" id="proc-procAwaiting" style="color:#ea580c;">0</div>
      <div class="disc-summary-lbl">Awaiting Quote</div>
    </div>
    <div class="disc-summary-item">
      <div class="disc-summary-num" id="proc-procOrdered" style="color:#4f46e5;">0</div>
      <div class="disc-summary-lbl">Ordered</div>
    </div>
    <div class="disc-summary-item">
      <div class="disc-summary-num" id="proc-procInStorage" style="color:#16a34a;">0</div>
      <div class="disc-summary-lbl">Received</div>
    </div>
  </div>

  <div class="proc-tab-panel active">
    <div class="card">
      <div class="card-head">
        <h3>All Tenders</h3>
        <div class="card-head-actions">
          <button class="pill-btn" onclick="printTenderHistory()">Print All</button>
        </div>
      </div>

      <div class="muted" style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;">Status</div>
      <div class="tender-filters" id="proc-activeFilters" style="margin-bottom:14px;">
        <button class="filter-btn active" data-filter="all"                onclick="setProcActiveFilter(this)">All</button>
        <button class="filter-btn"        data-filter="pending"            onclick="setProcActiveFilter(this)">Pending</button>
        <button class="filter-btn"        data-filter="awaiting_quotation" onclick="setProcActiveFilter(this)">Awaiting Quote</button>
        <button class="filter-btn"        data-filter="ordered"            onclick="setProcActiveFilter(this)">Ordered</button>
        <button class="filter-btn"        data-filter="received"           onclick="setProcActiveFilter(this)">Received</button>
        <button class="filter-btn"        data-filter="completed"          onclick="setProcActiveFilter(this)">Completed</button>
      </div>

      <div class="muted" style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;">Department</div>
      <div class="tender-filters" id="proc-deptFilters" style="margin-bottom:14px;">
        <button class="filter-btn active" data-dept="all"                 onclick="setProcDeptFilter(this)">All Depts</button>
        <button class="filter-btn"        data-dept="Medical"             onclick="setProcDeptFilter(this)">Medical</button>
        <button class="filter-btn"        data-dept="Nurses"              onclick="setProcDeptFilter(this)">Nurses</button>
        <button class="filter-btn"        data-dept="Mortuary"            onclick="setProcDeptFilter(this)">Mortuary</button>
        <button class="filter-btn"        data-dept="School of Nursing"   onclick="setProcDeptFilter(this)">School of Nursing</button>
        <button class="filter-btn"        data-dept="School of Midwifery" onclick="setProcDeptFilter(this)">School of Midwifery</button>
        <button class="filter-btn"        data-dept="Biomedical Equipment"onclick="setProcDeptFilter(this)">Biomedical Equipment</button>
        <button class="filter-btn"        data-dept="Radiography"         onclick="setProcDeptFilter(this)">Radiography</button>
        <button class="filter-btn"        data-dept="Catering"            onclick="setProcDeptFilter(this)">Catering</button>
        <button class="filter-btn"        data-dept="Security"            onclick="setProcDeptFilter(this)">Security</button>
        <button class="filter-btn"        data-dept="Laundry"             onclick="setProcDeptFilter(this)">Laundry</button>
        <button class="filter-btn"        data-dept="Health Information"  onclick="setProcDeptFilter(this)">Health Information</button>
        <button class="filter-btn"        data-dept="Accounts"            onclick="setProcDeptFilter(this)">Accounts</button>
        <button class="filter-btn"        data-dept="HR"                  onclick="setProcDeptFilter(this)">HR</button>
        <button class="filter-btn"        data-dept="Stores"              onclick="setProcDeptFilter(this)">Stores</button>
        <button class="filter-btn"        data-dept="Procurement"         onclick="setProcDeptFilter(this)">Procurement</button>
        <button class="filter-btn"        data-dept="IT"                  onclick="setProcDeptFilter(this)">IT</button>
      </div>

      <div class="filter-bar" style="display:flex;gap:10px;margin-bottom:15px;flex-wrap:wrap;align-items:flex-end;">
        <div class="form-group" style="margin:0;min-width:220px;flex:1;">
          <label>Search</label>
          <input type="text" id="proc-pendingSearch" placeholder="Item, requester, reason, ID..." onkeyup="filterProcurementOrders()">
        </div>
        <div class="form-group" style="margin:0;min-width:150px;">
          <label>From Date</label>
          <input type="date" id="proc-filterFrom" onchange="filterProcurementOrders()">
        </div>
        <div class="form-group" style="margin:0;min-width:150px;">
          <label>To Date</label>
          <input type="date" id="proc-filterTo" onchange="filterProcurementOrders()">
        </div>
        <div class="form-group" style="margin:0;">
          <button class="ghost-btn" onclick="clearProcFilters()">Clear All</button>
        </div>
      </div>

      <div class="muted" id="proc-resultCount" style="margin-bottom:8px;"></div>
      <div id="proc-pendingOrdersList"></div>
    </div>

    <div class="card">
      <h3>New Tender Request</h3>
      <div class="form-row">
        <div class="form-group">
          <label>Originator Department:</label>
          <select id="proc-reqOriginator">
            <option value="Procurement">Procurement</option>
            <option value="Medical">Medical</option>
            <option value="Nurses">Nurses</option>
            <option value="Mortuary">Mortuary</option>
            <option value="School of Nursing">School of Nursing</option>
            <option value="School of Midwifery">School of Midwifery</option>
            <option value="Biomedical Equipment">Biomedical Equipment</option>
            <option value="Radiography">Radiography</option>
            <option value="Catering">Catering</option>
            <option value="Security">Security</option>
            <option value="Laundry">Laundry</option>
            <option value="Health Information">Health Information</option>
            <option value="Accounts">Accounts</option>
            <option value="HR">HR</option>
            <option value="Stores">Stores</option>
            <option value="IT">IT</option>
          </select>
        </div>
        <div class="form-group">
          <label>Item Name: <span class="req">*</span></label>
          <input type="text" id="proc-reqItemName">
        </div>
        <div class="form-group">
          <label>Quantity: <span class="req">*</span></label>
          <input type="number" id="proc-reqQuantity" min="1">
        </div>
      </div>
      <div class="form-group">
        <label>Reason: <span class="req">*</span></label>
        <textarea id="proc-reqReason" rows="2"></textarea>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <button class="primary-btn" onclick="submitTenderRequest('proc')">Submit Request</button>
        <div id="proc-requestMessage" style="font-weight:600;font-size:13px;"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-head">
        <h3>My Department Tenders <span class="lock-badge">LOCKED TO YOUR DEPARTMENT</span></h3>
        <div class="card-head-actions">
          <input type="text" class="search-input" id="proc-tenderSearch" placeholder="Search tenders..." oninput="filterTenders()">
          <button class="pill-btn" onclick="printMyTenders()">Print</button>
        </div>
      </div>
      <div class="tender-filters" id="proc-tenderFilters">
        <button class="filter-btn active" data-filter="all" onclick="setTenderFilter(this)">All</button>
        <button class="filter-btn" data-filter="pending" onclick="setTenderFilter(this)">Pending</button>
        <button class="filter-btn" data-filter="awaiting_quotation" onclick="setTenderFilter(this)">Awaiting Quotation</button>
        <button class="filter-btn" data-filter="ordered" onclick="setTenderFilter(this)">Ordered</button>
        <button class="filter-btn" data-filter="received" onclick="setTenderFilter(this)">Received</button>
      </div>
      <div id="proc-tenderTrackerList" class="tender-tracker"></div>
    </div>
  </div>
</div>
