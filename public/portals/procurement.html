<div class="portal active" data-dept="Procurement">
  <h2>Procurement</h2>
  <p class="muted">Manage tender requests and supplier orders.</p>
  <div class="tabs">
    <button class="dept-tab active" data-tab="active" onclick="switchProcTab(this)">Active Board</button>
    <button class="dept-tab" data-tab="history" onclick="switchProcTab(this)">Tender History</button>
  </div>
  <div id="procTabActive" class="proc-tab-panel active">
    <div class="card">
      <div class="filter-bar" style="display:flex; gap:10px; margin-bottom:15px; flex-wrap:wrap;">
        <button class="filter-btn active" data-filter="pending" onclick="setProcActiveFilter(this)">Pending</button>
        <button class="filter-btn" data-filter="awaiting_quotation" onclick="setProcActiveFilter(this)">Awaiting Quote</button>
        <button class="filter-btn" data-filter="ordered" onclick="setProcActiveFilter(this)">Ordered</button>
        <button class="filter-btn" data-filter="received" onclick="setProcActiveFilter(this)">Received</button>
        <button class="filter-btn" data-filter="all" onclick="setProcActiveFilter(this)">All</button>
        <input type="text" id="proc-pendingSearch" placeholder="Search..." onkeyup="filterProcurementOrders()" style="margin-left:auto;">
      </div>
      <div id="proc-pendingOrdersList"></div>
    </div>
  </div>
  <div id="procTabHistory" class="proc-tab-panel" style="display:none;">
    <div class="card">
      <div class="card-header" style="display:flex; justify-content:space-between;">
        <h3>Tender History</h3>
        <button class="pill-btn" onclick="printTenderHistory()">Print History</button>
      </div>
      <div class="filter-bar" style="display:flex; gap:10px; margin-bottom:15px; flex-wrap:wrap;">
        <input type="text" id="histSearch" placeholder="Search..." onkeyup="debouncedHistorySearch()">
        <select id="histStatus" onchange="loadTenderHistory()"><option value="all">All Statuses</option><option value="pending">Pending</option><option value="awaiting_quotation">Awaiting Quote</option><option value="ordered">Ordered</option><option value="received">Received</option></select>
        <label>From: <input type="date" id="histFrom" onchange="loadTenderHistory()"></label>
        <label>To: <input type="date" id="histTo" onchange="loadTenderHistory()"></label>
      </div>
      <div id="proc-tenderHistoryList"></div>
    </div>
  </div>
</div>
