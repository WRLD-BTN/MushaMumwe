<div class="portal active" data-dept="Procurement">
  <h2>Procurement</h2>
  <p class="muted">Manage tender requests and supplier orders.</p>

  <div class="disc-summary" id="procSummary" style="margin-bottom:20px;">
    <div class="disc-summary-item">
      <div class="disc-summary-num" id="proc-procPending">0</div>
      <div class="disc-summary-lbl">Pending</div>
    </div>
    <div class="disc-summary-item">
      <div class="disc-summary-num" id="proc-procAwaiting" style="color:#ea580c;">0</div>
      <div class="disc-summary-lbl">Awaiting Quote</div>
    </div>
    <div class="disc-summary-item">
      <div class="disc-summary-num" id="proc-procOrdered" style="color:#4f46e5;">0</div>
      <div class="disc-summary-lbl">Ordered</div>
    </div>
    <div class="disc-summary-item">
      <div class="disc-summary-num" id="proc-procInStorage" style="color:#16a34a;">0</div>
      <div class="disc-summary-lbl">Received</div>
    </div>
  </div>

  <div class="dept-tabs">
    <button class="dept-tab active" data-tab="active" onclick="switchProcTab(this)">Active Board</button>
    <button class="dept-tab" data-tab="history" onclick="switchProcTab(this)">Tender History</button>
  </div>

  <!-- ============================================================ -->
  <!-- ACTIVE BOARD TAB                                              -->
  <!-- ============================================================ -->
  <div id="procTabActive" class="proc-tab-panel active">
    <div class="card">
      <div class="filter-bar" id="proc-activeFilters" style="display:flex;gap:10px;margin-bottom:15px;flex-wrap:wrap;">
        <button class="filter-btn active" data-filter="pending" onclick="setProcActiveFilter(this)">Pending</button>
        <button class="filter-btn" data-filter="awaiting_quotation" onclick="setProcActiveFilter(this)">Awaiting Quote</button>
        <button class="filter-btn" data-filter="ordered" onclick="setProcActiveFilter(this)">Ordered</button>
        <button class="filter-btn" data-filter="received" onclick="setProcActiveFilter(this)">Received</button>
        <button class="filter-btn" data-filter="all" onclick="setProcActiveFilter(this)">All</button>
        <input type="text" id="proc-pendingSearch" placeholder="Search..." onkeyup="filterProcurementOrders()" style="margin-left:auto;">
      </div>
      <div id="proc-pendingOrdersList"></div>
    </div>
  </div>

  <!-- ============================================================ -->
  <!-- TENDER HISTORY TAB                                           -->
  <!-- ============================================================ -->
  <div id="procTabHistory" class="proc-tab-panel" style="display:none;">
    <div class="card">
      <div class="card-head">
        <h3>Tender History - All Departments</h3>
        <div class="card-head-actions">
          <button class="pill-btn" onclick="printTenderHistory()">Print History</button>
        </div>
      </div>

      <div class="disc-summary" style="margin-bottom:16px;">
        <div class="disc-summary-item">
          <div class="disc-summary-num" id="hTotal">0</div>
          <div class="disc-summary-lbl">Total</div>
        </div>
        <div class="disc-summary-item">
          <div class="disc-summary-num" id="hPending">0</div>
          <div class="disc-summary-lbl">Pending</div>
        </div>
        <div class="disc-summary-item">
          <div class="disc-summary-num" id="hApproved">0</div>
          <div class="disc-summary-lbl">Ordered</div>
        </div>
        <div class="disc-summary-item">
          <div class="disc-summary-num" id="hRejected">0</div>
          <div class="disc-summary-lbl">Awaiting Quote</div>
        </div>
        <div class="disc-summary-item">
          <div class="disc-summary-num" id="hReceived">0</div>
          <div class="disc-summary-lbl">Received</div>
        </div>
        <div class="disc-summary-item">
          <div class="disc-summary-num" id="hRecent">0</div>
          <div class="disc-summary-lbl">Last 30 Days</div>
        </div>
      </div>

      <div class="filter-bar" style="display:flex;gap:10px;margin-bottom:15px;flex-wrap:wrap;align-items:flex-end;">
        <div class="form-group" style="margin:0;min-width:220px;flex:1;">
          <label>Search</label>
          <input type="text" id="histSearch" placeholder="Item, requester, reason, ID..." onkeyup="debouncedHistorySearch()">
        </div>
        <div class="form-group" style="margin:0;min-width:160px;">
          <label>Status</label>
          <select id="histStatus" onchange="loadTenderHistory()">
            <option value="all">All Statuses</option>
            <option value="pending">Pending</option>
            <option value="awaiting_quotation">Awaiting Quote</option>
            <option value="ordered">Ordered</option>
            <option value="received">Received</option>
            <option value="completed">Completed</option>
          </select>
        </div>
        <div class="form-group" style="margin:0;min-width:160px;">
          <label>Department</label>
          <select id="histDept" onchange="loadTenderHistory()">
            <option value="all">All Departments</option>
            <option value="Medical">Medical</option>
            <option value="Nurses">Nurses</option>
            <option value="Mortuary">Mortuary</option>
            <option value="School of Nursing">School of Nursing</option>
            <option value="School of Midwifery">School of Midwifery</option>
            <option value="Biomedical Equipment">Biomedical Equipment</option>
            <option value="Radiography">Radiography</option>
            <option value="Catering">Catering</option>
            <option value="Security">Security</option>
            <option value="Laundry">Laundry</option>
            <option value="Health Information">Health Information</option>
            <option value="Accounts">Accounts</option>
            <option value="IT">IT</option>
            <option value="HR">HR</option>
            <option value="Procurement">Procurement</option>
            <option value="Stores">Stores</option>
          </select>
        </div>
        <div class="form-group" style="margin:0;min-width:140px;">
          <label>From</label>
          <input type="date" id="histFrom" onchange="loadTenderHistory()">
        </div>
        <div class="form-group" style="margin:0;min-width:140px;">
          <label>To</label>
          <input type="date" id="histTo" onchange="loadTenderHistory()">
        </div>
        <div class="form-group" style="margin:0;">
          <button class="ghost-btn" onclick="clearHistoryFilters()">Clear</button>
        </div>
      </div>

      <div class="muted" id="histCount" style="margin-bottom:8px;"></div>
      <div id="proc-tenderHistoryList" class="tender-tracker" style="max-height: 400px; overflow-y: auto;"></div>
    </div>
  </div>
</div>
