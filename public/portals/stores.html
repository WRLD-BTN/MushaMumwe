<div class="portal active" data-dept="Stores">
  <h2>Stores / Inventory</h2>
  <p class="muted">Manage stock levels and receive approved orders.</p>
  <div class="card">
    <div class="card-header" style="display:flex; justify-content:space-between;">
      <h3>Inventory Status</h3>
      <button class="pill-btn" onclick="printInventory()">Print Inventory</button>
    </div>
    <div class="filter-bar" style="display:flex; gap:10px; margin-bottom:15px;"><input type="text" id="stores-invSearch" placeholder="Search inventory..." onkeyup="filterInventory()" style="flex:1;"></div>
    <div id="stores-inventoryList"></div>
  </div>
  <div class="card">
    <h3>Receive Items</h3>
    <p class="muted">Select an approved order from the list below to automatically fill the details.</p>
    <div class="form-row">
      <div class="form-group"><label>Order ID:</label><input type="text" id="stores-receiveOrderId" readonly></div>
      <div class="form-group"><label>Item Name:</label><input type="text" id="stores-receiveItemName"></div>
      <div class="form-group"><label>Qty Received:</label><input type="number" id="stores-receiveQty"></div>
      <div class="form-group" style="flex:0 0 200px; display:flex; align-items:flex-end;"><button class="primary-btn" onclick="receiveItems()">Receive Items</button></div>
    </div>
    <div class="form-group"><label>Notes:</label><textarea id="stores-receiveNotes" rows="2"></textarea></div>
    <div id="stores-receiveMessage"></div>
  </div>
  <div class="card">
    <h3>Approved Orders Waiting</h3>
    <div class="filter-bar" style="display:flex; gap:10px; margin-bottom:15px;"><input type="text" id="stores-approvedSearch" placeholder="Search orders..." onkeyup="filterApprovedForStores()" style="flex:1;"></div>
    <div id="stores-approvedOrders"></div>
  </div>
  <div class="card">
    <div class="card-header" style="display:flex; justify-content:space-between;">
      <h3>My Department Tenders</h3>
      <button class="pill-btn" onclick="printMyTenders()">Print Report</button>
    </div>
    <div id="stores-tenderTrackerList"></div>
  </div>
</div>
