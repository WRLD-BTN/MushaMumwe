<div class="portal active" data-dept="Stores">
  <h2>Stores Management</h2>
  <p class="muted">Track inventory, receive approved orders, and manage stock levels.</p>

  <!-- SUMMARY STRIP -->
  <div class="disc-summary" style="margin-bottom: 24px;">
    <div class="disc-summary-item">
      <div class="disc-summary-num" id="stores-invTotal">0</div>
      <div class="disc-summary-lbl">Total Items</div>
    </div>
    <div class="disc-summary-item" style="border-bottom: 3px solid #dc2626;">
      <div class="disc-summary-num" id="stores-invCritical" style="color:#dc2626;">0</div>
      <div class="disc-summary-lbl">Critical (&lt;10)</div>
    </div>
    <div class="disc-summary-item" style="border-bottom: 3px solid #ea580c;">
      <div class="disc-summary-num" id="stores-invLow" style="color:#ea580c;">0</div>
      <div class="disc-summary-lbl">Low (10–49)</div>
    </div>
    <div class="disc-summary-item" style="border-bottom: 3px solid #16a34a;">
      <div class="disc-summary-num" id="stores-invAdequate" style="color:#16a34a;">0</div>
      <div class="disc-summary-lbl">Adequate (≥50)</div>
    </div>
  </div>

  <!-- ============================================================ -->
  <!-- ROW 1: APPROVED ORDERS (LEFT) & RECEIVE ITEMS (RIGHT)        -->
  <!-- ============================================================ -->
  <div class="grid" style="grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; align-items: start;">
    
    <!-- APPROVED ORDERS WAITING (Left) -->
    <div class="card" style="margin: 0;">
      <div class="card-head">
        <h3>Approved Orders Waiting</h3>
        <div class="card-head-actions">
          <input type="text" class="search-input" id="stores-approvedSearch" placeholder="Search orders..." oninput="filterApprovedForStores()">
        </div>
      </div>
      <div id="stores-approvedOrders" style="max-height: 350px; overflow-y: auto;"></div>
    </div>

    <!-- RECEIVE ITEMS (Right) -->
    <div class="card" style="margin: 0; background: var(--surface-alt);">
      <div class="card-head">
        <h3>Receive Items</h3>
        <span class="badge badge-ordered">Accept Order</span>
      </div>
      <p class="muted" style="margin-bottom: 16px;">Enter details manually, or click "Receive" on an approved order.</p>

      <div class="form-group">
        <label>Order ID (Auto-filled):</label>
        <input type="text" id="stores-receiveOrderId" readonly>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Item Name: <span class="req">*</span></label>
          <input type="text" id="stores-receiveItemName">
        </div>
        <div class="form-group" style="max-width: 120px;">
          <label>Qty: <span class="req">*</span></label>
          <input type="number" id="stores-receiveQty" min="1">
        </div>
      </div>
      <div class="form-group">
        <label>Notes:</label>
        <textarea id="stores-receiveNotes" rows="2" placeholder="Optional delivery notes"></textarea>
      </div>
      <button class="primary-btn block" style="background: var(--success);" onclick="receiveItems()">Confirm Receipt</button>
      <div id="stores-receiveMessage" style="margin-top: 10px; font-weight: 600; font-size: 13px;"></div>
    </div>
  </div>

  <!-- ============================================================ -->
  <!-- ROW 2: INVENTORY STATUS                                      -->
  <!-- ============================================================ -->
  <div class="card">
    <div class="card-head">
      <h3>Inventory Status</h3>
      <div class="card-head-actions">
        <input type="text" class="search-input" id="stores-invSearch" placeholder="Search inventory..." oninput="filterInventory()">
        <button class="pill-btn" onclick="printInventory()">Print Inventory</button>
      </div>
    </div>
    <div id="stores-inventoryList" class="table-wrap roster-scroll" style="max-height: 350px; overflow-y: auto;"></div>
  </div>

</div>
