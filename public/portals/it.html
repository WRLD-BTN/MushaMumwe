<div class="portal active" data-dept="IT">
  <h2>IT Management</h2>
  <p class="muted">Manage users, system settings, and IT tenders.</p>

  <div class="card">
    <h3>System Overview</h3>
    <div class="stats-grid">
      <div class="stat-box"><span class="stat-val" id="it-totalUsers">-</span><span class="stat-lbl">Total Users</span></div>
    </div>
  </div>

  <div class="card">
    <h3>User Management</h3>
    <div class="form-row">
      <div class="form-group"><label>Username:</label><input type="text" id="it-newUsername"></div>
      <div class="form-group"><label>Full Name:</label><input type="text" id="it-newUserFullName"></div>
      <div class="form-group">
        <label>Department:</label>
        <select id="it-newUserDept">
          <option value="Medical">Medical</option>
          <option value="Nurses">Nurses</option>
          <option value="Mortuary">Mortuary</option>
          <option value="School of Nursing">School of Nursing</option>
          <option value="School of Midwifery">School of Midwifery</option>
          <option value="Biomedical Equipment">Biomedical Equipment</option>
          <option value="Radiography">Radiography</option>
          <option value="Catering">Catering</option>
          <option value="Security">Security</option>
          <option value="Laundry">Laundry</option>
          <option value="Health Information">Health Information</option>
          <option value="Accounts">Accounts</option>
          <option value="HR">HR</option>
          <option value="Stores">Stores</option>
          <option value="Procurement">Procurement</option>
          <option value="IT">IT</option>
        </select>
      </div>
      <div class="form-group" style="flex:0 0 auto; display:flex; align-items:flex-end;"><button class="primary-btn" onclick="createUser()">Create User</button></div>
    </div>
    <div id="it-createUserMessage" style="margin-bottom:15px;"></div>
    <div class="filter-bar" style="display:flex; gap:10px; margin-bottom:15px;"><input type="text" id="it-userSearch" placeholder="Search users..." onkeyup="filterUserList()" style="flex:1;"></div>
    <div id="it-userList"></div>
  </div>

  <div class="card">
    <h3>New Tender Request</h3>
    <div class="form-row">
      <div class="form-group">
        <label>Originator Department:</label>
        <select id="it-reqOriginator">
          <option value="IT">IT</option>
          <option value="Medical">Medical</option>
          <option value="Nurses">Nurses</option>
          <option value="Mortuary">Mortuary</option>
          <option value="School of Nursing">School of Nursing</option>
          <option value="School of Midwifery">School of Midwifery</option>
          <option value="Biomedical Equipment">Biomedical Equipment</option>
          <option value="Radiography">Radiography</option>
          <option value="Catering">Catering</option>
          <option value="Security">Security</option>
          <option value="Laundry">Laundry</option>
          <option value="Health Information">Health Information</option>
          <option value="Accounts">Accounts</option>
          <option value="HR">HR</option>
          <option value="Stores">Stores</option>
          <option value="Procurement">Procurement</option>
        </select>
      </div>
      <div class="form-group">
        <label>Item Name: <span class="req">*</span></label>
        <input type="text" id="it-reqItemName">
      </div>
      <div class="form-group">
        <label>Quantity: <span class="req">*</span></label>
        <input type="number" id="it-reqQuantity" min="1">
      </div>
    </div>
    <div class="form-group">
      <label>Reason: <span class="req">*</span></label>
      <textarea id="it-reqReason" rows="2"></textarea>
    </div>
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <button class="primary-btn" onclick="submitITTender()">Submit Request</button>
      <div id="it-requestMessage" style="font-weight:600; font-size:13px;"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-head">
      <h3>My Department Tenders <span class="lock-badge">LOCKED TO YOUR DEPARTMENT</span></h3>
      <div class="card-head-actions">
        <input type="text" class="search-input" id="it-tenderSearch" placeholder="Search tenders..." oninput="filterTenders()">
        <button class="pill-btn" onclick="printMyTenders()">Print Report</button>
      </div>
    </div>

    <div class="muted" style="font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:6px;">Status</div>
    <div class="tender-filters" id="it-tenderFilters" style="margin-bottom:14px;">
      <button class="filter-btn active" data-filter="all"                onclick="setTenderFilter(this)">All</button>
      <button class="filter-btn"        data-filter="pending"            onclick="setTenderFilter(this)">Pending</button>
      <button class="filter-btn"        data-filter="awaiting_quotation" onclick="setTenderFilter(this)">Awaiting Quote</button>
      <button class="filter-btn"        data-filter="ordered"            onclick="setTenderFilter(this)">Ordered</button>
      <button class="filter-btn"        data-filter="received"           onclick="setTenderFilter(this)">Received</button>
      <button class="filter-btn"        data-filter="completed"          onclick="setTenderFilter(this)">Completed</button>
    </div>

    <div class="muted" id="it-tenderResultCount" style="margin-bottom:8px;"></div>

    <div id="it-tenderTrackerList"></div>
  </div>
</div>
