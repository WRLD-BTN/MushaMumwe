<div class="portal active" data-dept="IT">
  <h2>IT Management</h2>
  <p class="muted">Manage users, system settings, and IT operations.</p>

  <!-- TABS -->
  <div class="dept-tabs" style="margin-bottom: 20px;">
    <button class="dept-tab active" onclick="switchITTab(this, 'tab-it-dashboard')">Dashboard</button>
    <button class="dept-tab" onclick="switchITTab(this, 'tab-it-users')">User Management</button>
  </div>

  <!-- ============================================================ -->
  <!-- TAB 1: DASHBOARD                                             -->
  <!-- ============================================================ -->
  <div id="tab-it-dashboard" class="proc-tab-panel active" style="display: block;">
    
    <!-- SUMMARY STRIP -->
    <div class="disc-summary" style="margin-bottom: 20px;">
      <div class="disc-summary-item" style="border-bottom: 3px solid var(--primary);">
        <div class="disc-summary-num" id="it-totalUsers" style="color: var(--primary);">-</div>
        <div class="disc-summary-lbl">Total System Users</div>
      </div>
    </div>

    <div class="grid" style="grid-template-columns: 1fr 1fr; gap: 20px; align-items: start;">
      
      <!-- CREATE USER -->
      <div class="card" style="margin: 0;">
        <div class="card-head">
          <h3>Create New User</h3>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Username: <span class="req">*</span></label>
            <input type="text" id="it-newUsername">
          </div>
          <div class="form-group">
            <label>Full Name: <span class="req">*</span></label>
            <input type="text" id="it-newUserFullName">
          </div>
        </div>
        <div class="form-group">
          <label>Department:</label>
          <select id="it-newUserDept">
            <option value="Medical">Medical</option>
            <option value="Nurses">Nurses</option>
            <option value="Mortuary">Mortuary</option>
            <option value="School of Nursing">School of Nursing</option>
            <option value="School of Midwifery">School of Midwifery</option>
            <option value="Biomedical Equipment">Biomedical Equipment</option>
            <option value="Radiography">Radiography</option>
            <option value="Catering">Catering</option>
            <option value="Security">Security</option>
            <option value="Laundry">Laundry</option>
            <option value="Health Information">Health Information</option>
            <option value="Accounts">Accounts</option>
            <option value="HR">HR</option>
            <option value="Stores">Stores</option>
            <option value="Procurement">Procurement</option>
            <option value="IT">IT</option>
          </select>
        </div>
        <button class="primary-btn block" onclick="createUser()">Create User</button>
        <div id="it-createUserMessage" style="margin-top: 10px;"></div>
      </div>

      <!-- QUICK ACTIONS -->
      <div class="card" style="margin: 0; background: var(--surface-alt);">
        <div class="card-head">
          <h3>System Status</h3>
        </div>
        <p class="muted" style="margin-bottom: 16px;">Ensure the database and socket server are running smoothly.</p>
        <button onclick="loadSystemStatus()" class="ghost-btn block">Refresh System Status</button>
      </div>

    </div>
  </div>

  <!-- ============================================================ -->
  <!-- TAB 2: USER MANAGEMENT                                       -->
  <!-- ============================================================ -->
  <div id="tab-it-users" class="proc-tab-panel" style="display: none;">
    <div class="card">
      <div class="card-head">
        <h3>User Directory</h3>
        <div class="card-head-actions">
          <input type="text" class="search-input" id="it-userSearch" placeholder="Search users..." oninput="filterUserList()">
        </div>
      </div>
      
      <!-- 5-ROW SCROLLABLE TABLE -->
      <div id="it-userList" class="table-wrap roster-scroll" style="max-height: 350px; overflow-y: auto;"></div>
    </div>
  </div>

</div>
