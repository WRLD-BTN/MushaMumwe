<div class="portal active" data-dept="Medical">
  <h2>Medical Department (Doctors)</h2>
  <p class="muted">Manage clinical patient lists, request supplies, and track departmental projects.</p>

  <!-- SUMMARY STRIP -->
  <div class="disc-summary" style="margin-bottom: 20px;">
    <div class="disc-summary-item" style="border-bottom: 3px solid var(--primary);">
      <div class="disc-summary-num" id="med-activePatients" style="color: var(--primary);">0</div>
      <div class="disc-summary-lbl">Active Patients</div>
    </div>
  </div>

  <div class="grid" style="grid-template-columns: 1fr; gap: 20px; margin-bottom: 20px; align-items: start;">
    
    <!-- PATIENT ROSTER -->
    <div class="card" style="margin: 0;">
      <div class="card-head">
        <h3>Admitted Patients (Roster)</h3>
        <div class="card-head-actions">
          <input type="text" class="search-input" id="med-patientSearch" placeholder="Search by name or ward..." oninput="renderMedicalPatients()">
          <button class="pill-btn" onclick="printMedicalPatients()">Print</button>
        </div>
      </div>
      
      <!-- 5 ROW SCROLLABLE LIST -->
      <div id="med-patientList" class="table-wrap roster-scroll" style="max-height: 220px; overflow-y: auto;"></div>
    </div>

  </div>
</div>
