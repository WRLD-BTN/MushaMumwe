<div class="card" style="grid-column: span 2;" id="projectsCard" data-dept="">
  <div class="card-head">
    <h3>Projects</h3>
    <div class="card-head-actions">
      <select id="projectsScopeFilter" class="search-input" style="min-width:auto;" onchange="runProjectSearch()">
        <option value="own">My Department</option>
        <option value="all">All Departments</option>
      </select>
      <select id="projectsStatusFilter" class="search-input" style="min-width:auto;" onchange="runProjectSearch()">
        <option value="all">All Statuses</option>
        <option value="ongoing">Ongoing</option>
        <option value="pending">Pending</option>
        <option value="completed">Completed</option>
      </select>
      <input type="text" class="search-input" id="projectsSearchBox" placeholder="Search projects..." oninput="debouncedProjectSearch()">
      <button class="primary-btn small" onclick="openProjectNewModal()">New Project</button>
      <button class="pill-btn" onclick="printProjects()">Print</button>
    </div>
  </div>

  <div class="disc-summary" id="projectsSummary">
    <div class="disc-summary-item">
      <div class="disc-summary-num" id="projectsSummaryTotal">0</div>
      <div class="disc-summary-lbl">Total</div>
    </div>
    <div class="disc-summary-item">
      <div class="disc-summary-num" id="projectsSummaryOngoing" style="color:#2563eb;">0</div>
      <div class="disc-summary-lbl">Ongoing</div>
    </div>
    <div class="disc-summary-item">
      <div class="disc-summary-num" id="projectsSummaryPending" style="color:#dc2626;">0</div>
      <div class="disc-summary-lbl">Pending</div>
    </div>
    <div class="disc-summary-item">
      <div class="disc-summary-num" id="projectsSummaryCompleted" style="color:#16a34a;">0</div>
      <div class="disc-summary-lbl">Completed</div>
    </div>
  </div>

  <div id="projectsList" class="tender-tracker"></div>
</div>
